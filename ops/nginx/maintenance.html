<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<meta name="robots" content="noindex">
<title>صيانة مؤقتة</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: #f5f7fa; color: #1f2937; }
  main { max-width: 520px; text-align: center; background: #fff; border-radius: 16px; padding: 32px 24px;
         box-shadow: 0 4px 24px rgba(0, 0, 0, .06); }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 8px 0; line-height: 1.8; color: #4b5563; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #f3f4f6; }
    main { background: #1f2937; box-shadow: none; }
    p { color: #d1d5db; }
  }
</style>
</head>
<body>
<main>
  <h1>النظام قيد التحديث أو الصيانة</h1>
  <p>نعمل حاليًا على تحديث النظام. ستعود الخدمة خلال لحظات، وستُحدَّث هذه الصفحة تلقائيًا.</p>
  <p lang="en" dir="ltr">The service is being updated and will be back shortly.</p>
</main>
</body>
</html>
