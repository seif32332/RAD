<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاشتراك غير نشط - رديف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.15);
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.2;
            z-index: 1;
        }

        /* Abstract glowing blobs */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-red-glow) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 2;
            filter: blur(40px);
            animation: float 8s ease-in-out infinite alternate;
        }

        .blob-1 {
            top: 10%;
            right: 10%;
        }

        .blob-2 {
            bottom: 10%;
            left: 10%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 3;
            max-width: 500px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: var(--accent-red-glow);
            border: 2px solid var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 0 20px var(--accent-red-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .icon-container svg {
            width: 38px;
            height: 38px;
            fill: var(--accent-red);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 25px 0;
            width: 100%;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 24px;
            background-color: #25d366; /* WhatsApp green */
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3);
            filter: brightness(1.05);
        }

        .action-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .support-info {
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .support-info a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .support-info a:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
        </div>
        <h1>عذراً، هذا الاشتراك غير نشط حالياً</h1>
        <p>تم إيقاف الخدمة مؤقتاً لانتهاء فترة الترخيص المخصصة لهذه النسخة. يرجى التواصل مع إدارة نظام (رديف) لتجديد الاشتراك وتفعيل الخدمة مجدداً.</p>
        
        <div class="divider"></div>

        <a href="https://wa.me/966593119252" class="action-button" target="_blank">

            تواصل معنا عبر واتساب للتجديد

            أو عبر البريد الإلكتروني: <a href="mailto:info@radeef-sa.com">info@radeef-sa.com</a>
        </div>
    </div>
</body>
</html>
