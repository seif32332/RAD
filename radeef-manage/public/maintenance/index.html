<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <title>الخدمة قيد الصيانة - رديف</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', Tahoma, Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background-color: var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 34px; height: 34px; fill: var(--accent); }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
        p { font-size: 15px; color: var(--text-secondary); line-height: 1.8; }
        .hint { margin-top: 18px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
            </svg>
        </div>
        <h1>الخدمة غير متاحة مؤقتاً</h1>
        <p>نقوم حالياً بأعمال صيانة أو تحديث للنظام. ستعود الخدمة خلال دقائق، يرجى المحاولة مرة أخرى لاحقاً.</p>
        <p class="hint">سيتم تحديث هذه الصفحة تلقائياً.</p>
    </div>
</body>
</html>
